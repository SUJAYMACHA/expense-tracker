version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: expense-tracker-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: expense_tracker
    volumes:
      - mongo-data:/data/db
    networks:
      - expense-network

  api:
    build: .
    container_name: expense-tracker-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/expense_tracker
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: 7d
    depends_on:
      - mongodb
    networks:
      - expense-network

volumes:
  mongo-data:

networks:
  expense-network:
    driver: bridge
